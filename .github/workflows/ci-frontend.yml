name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: 'false'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    name: Lint, Type Check & Build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm tsc --noEmit
      - run: pnpm build
      - name: Check build output
        run: test -d .next && echo "Build successful" || exit 1

  test:
    runs-on: ubuntu-latest
    name: Tests (if any)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --run 2>/dev/null || echo "No tests configured"
